<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17345f" />
    <meta name="description" content="The Admin’s own phone app for an Infoflex shop: stock, sales, reports and approvals." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Infoflex Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Infoflex Admin Mobile</title>
    <style>
      /* The splash paints before any script runs, so the phone shows the shop's colours immediately. */
      html, body { margin: 0; background: #17345f; }
      .splash {
        display: grid; place-items: center; align-content: center; gap: 16px;
        min-height: 100dvh; padding: 24px; box-sizing: border-box;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #f7f3e8; text-align: center;
      }
      .splash__mark {
        display: grid; place-items: center; width: 84px; height: 84px; border-radius: 24px;
        background: linear-gradient(145deg, #24487a, #17345f); border: 1px solid #c9a24b66;
        color: #e6c77c; font-size: 40px; font-weight: 800;
      }
      .splash__name { font-size: 15px; font-weight: 800; letter-spacing: .14em; }
      .splash__tag { color: #b9c4d4; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
      .splash__dot {
        width: 8px; height: 8px; border-radius: 50%; background: #c9a24b;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse { 50% { opacity: .4; transform: scale(.8); } }
      @media (prefers-reduced-motion: reduce) { .splash__dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="splash" aria-live="polite">
        <div class="splash__mark" aria-hidden="true">I</div>
        <div class="splash__name">INFOFLEX ADMIN</div>
        <div class="splash__tag">Strategy | Consulting | Innovation</div>
        <span class="splash__dot"></span>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
